<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevPulse - Production-ready developer productivity dashboard authentication entry point. Secure client-side account creation and login.">
  <title>DevPulse — Developer Productivity Dashboard</title>

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Locomotive Scroll CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css">

  <!-- Design System & Auth Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- External Library CDNs (GSAP & Locomotive Scroll) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
</head>
<body>
  <!-- Smooth Scroll Wrapper Container for Locomotive Scroll -->
  <div class="scroll-container" data-scroll-container>
    <main class="auth-wrapper">
      
      <!-- 3D Perspective Card Wrapper -->
      <div class="card-perspective-wrapper">
        <div class="auth-card" id="authCard">
          
          <!-- Card Header & Brand Mark -->
          <header class="auth-header">
            <div class="brand-badge">
              <div class="brand-icon" aria-hidden="true">
                <!-- Inline SVG Pulse Icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
              </div>
              <span class="brand-name">DevPulse</span>
            </div>
            <h1 class="auth-title" id="cardTitle">Welcome back</h1>
            <p class="auth-subtitle" id="cardSubtitle">Log in to your productivity dashboard</p>
          </header>

          <!-- Top Global Alert Area -->
          <div id="globalAlert" class="global-alert" role="alert" aria-live="polite"></div>

          <!-- Forms Container -->
          <div class="form-container">
            
            <!-- LOGIN VIEW STATE -->
            <div id="loginView" class="form-view">
              <form id="loginForm" class="auth-form" novalidate>
                
                <!-- Email Field -->
                <div class="form-group">
                  <label for="loginEmail" class="form-label">Email address</label>
                  <div class="input-wrapper">
                    <input 
                      type="email" 
                      id="loginEmail" 
                      name="email" 
                      class="form-input" 
                      placeholder="you@example.com" 
                      autocomplete="username" 
                      required
                    >
                  </div>
                  <div class="field-error" id="loginEmailError" aria-live="polite"></div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                  <label for="loginPassword" class="form-label">Password</label>
                  <div class="input-wrapper">
                    <input 
                      type="password" 
                      id="loginPassword" 
                      name="password" 
                      class="form-input has-toggle" 
                      placeholder="••••••••" 
                      autocomplete="current-password" 
                      required
                    >
                    <button type="button" class="toggle-password-btn" data-target="loginPassword" aria-label="Show password">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                      </svg>
                    </button>
                  </div>
                  <div class="field-error" id="loginPasswordError" aria-live="polite"></div>
                </div>

                <!-- Form Options -->
                <div class="form-options">
                  <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginSubmitBtn" class="btn-primary">Log In</button>
              </form>

              <!-- View Switch Footer -->
              <div class="auth-footer">
                <span>Don't have an account?</span>
                <button type="button" id="switchToSignup" class="switch-auth-btn">Sign up</button>
              </div>
            </div>

            <!-- SIGNUP VIEW STATE (Flipped) -->
            <div id="signupView" class="form-view hidden">
              <form id="signupForm" class="auth-form" novalidate>
                
                <!-- Full Name Field -->
                <div class="form-group">
                  <label for="signupName" class="form-label">Full Name</label>
                  <div class="input-wrapper">
                    <input 
                      type="text" 
                      id="signupName" 
                      name="fullName" 
                      class="form-input" 
                      placeholder="Alex Morgan" 
                      autocomplete="name" 
                      required
                    >
                  </div>
                  <div class="field-error" id="signupNameError" aria-live="polite"></div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                  <label for="signupEmail" class="form-label">Email address</label>
                  <div class="input-wrapper">
                    <input 
                      type="email" 
                      id="signupEmail" 
                      name="email" 
                      class="form-input" 
                      placeholder="you@example.com" 
                      autocomplete="email" 
                      required
                    >
                  </div>
                  <div class="field-error" id="signupEmailError" aria-live="polite"></div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                  <label for="signupPassword" class="form-label">Password</label>
                  <div class="input-wrapper">
                    <input 
                      type="password" 
                      id="signupPassword" 
                      name="password" 
                      class="form-input has-toggle" 
                      placeholder="At least 8 characters" 
                      autocomplete="new-password" 
                      required
                    >
                    <button type="button" class="toggle-password-btn" data-target="signupPassword" aria-label="Show password">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                      </svg>
                    </button>
                  </div>

                  <!-- Real-time Password Strength Meter -->
                  <div class="strength-meter" id="strengthMeter" data-score="0">
                    <div class="strength-bars" aria-hidden="true">
                      <span class="strength-bar bar-1"></span>
                      <span class="strength-bar bar-2"></span>
                      <span class="strength-bar bar-3"></span>
                    </div>
                    <div class="strength-label-wrapper">
                      <span>Password strength</span>
                      <span class="strength-text" id="strengthText">None</span>
                    </div>
                  </div>
                  
                  <div class="field-error" id="signupPasswordError" aria-live="polite"></div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                  <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
                  <div class="input-wrapper">
                    <input 
                      type="password" 
                      id="signupConfirmPassword" 
                      name="confirmPassword" 
                      class="form-input has-toggle" 
                      placeholder="Re-enter password" 
                      autocomplete="new-password" 
                      required
                    >
                    <button type="button" class="toggle-password-btn" data-target="signupConfirmPassword" aria-label="Show password">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                      </svg>
                    </button>
                  </div>
                  <div class="field-error" id="signupConfirmPasswordError" aria-live="polite"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="signupSubmitBtn" class="btn-primary">Create Account</button>
              </form>

              <!-- View Switch Footer -->
              <div class="auth-footer">
                <span>Already have an account?</span>
                <button type="button" id="switchToLogin" class="switch-auth-btn">Log In</button>
              </div>
            </div>

          </div><!-- /form-container -->

        </div><!-- /auth-card -->
      </div><!-- /card-perspective-wrapper -->

    </main>
  </div><!-- /scroll-container -->

  <!-- Application Main Entry Script (ES6 Module) -->
  <script type="module" src="js/main-auth.js"></script>
</body>
</html>
